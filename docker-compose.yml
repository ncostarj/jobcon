services:
  jobcon_app:
    image: homelab/php:8.2
    container_name: jobcon_app
    working_dir: /var/www/html/jobcon
    volumes:
      - ./src:/var/www/html/jobcon
    restart: unless-stopped
    networks:
      - proxy
      - internal
  jobcon_nginx:
    image: nginx:alpine
    container_name: jobcon_nginx
    working_dir: /var/www/html/jobcon
    volumes:
      - ./docker/config/nginx/conf.d:/etc/nginx/conf.d
      - ./src:/var/www/html/jobcon
    depends_on:
      - jobcon_app
    restart: unless-stopped
    networks:
      - proxy
networks:
  proxy:
    external: true
  internal:
    external: true
