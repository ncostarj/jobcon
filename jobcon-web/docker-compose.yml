services:
  webserver:
    image: nginx:latest
    container_name: webserver
    hostname: jobcon.homelab
    working_dir: /var/www/html/jobcon-web
    ports:
      - "8083:80"
    volumes:
      - .:/var/www/html/jobcon-web
      - ./docker/config/nginx/sites-available:/etc/nginx/sites-available
      - ./docker/config/nginx/sites-enabled:/etc/nginx/sites-enabled
      - ./docker/config/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - appserver
    restart: unless-stopped
    networks:
      - homelab

  appserver:
    build: 
      context: .
      dockerfile: ./docker/config/php/82/Dockerfile
    container_name: appserver
    working_dir: /var/www/html/jobcon-web
    volumes:
      - ./docker/config/php/php.ini:/usr/local/etc/php/php.ini
      - .:/var/www/html/jobcon-web
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    restart: unless-stopped
    networks:
      - homelab

networks:
  homelab:
    external: true
    name: homelab_lan
