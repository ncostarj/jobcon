services:
  siteweb:
    build: .
    # image: myimg
    hostname: site.homelab
    container_name: siteweb
    working_dir: /var/www/site
    ports:
      - 8084:80
    volumes:
      - ./www/site:/var/www/site
      - ./config/default.conf:/etc/nginx/conf.d/default.conf
      # - ./config/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    networks:
      lan:
networks:
  lan:
