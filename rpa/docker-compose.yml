version: '3'
services:
  jobconrpaweb:
    build: .
    container_name: jobconrpa_web
    ports:
      - 8000:82
      - 8001:3000
      - 8002:3001
    volumes:
      - .:/var/www/html/rpa-jobcon
    restart: always
    # command:  npm start --prefix api
    networks:
      lan:
        ipv4_address: 10.20.20.1
volumes:
  esdata1:
    driver: local
  # esdata2:
  #   driver: local
networks:
  lan:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.20.20.0/16
