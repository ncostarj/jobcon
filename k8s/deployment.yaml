apiVersion: v1
kind: Service
metadata:
  name: mysite-service
  labels:
    app: mysite-service
    tier: nginx
spec:
  type: NodePort
  ports:
    - port: 8081
      targetPort: 80
      nodePort: 30001
  selector:
    app: mysite    # Matches the pods
    tier: nginx
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysite-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/home/newtoncosta/Projetos/newton/k8s/docker/www/site"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysite-pvc
  labels:
    app: mysite-pvc
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysite-deploy
  labels:
    app: mysite-deploy    # Updated to match the service selector
    tier: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: mysite-deploy
      tier: nginx
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysite-deploy    # Updated to match the selector
        tier: nginx
    spec:
      containers:
        - name: nginx
          image: myimg:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: mydeployvolume
              mountPath: /var/www/site
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      volumes:
        - name: mydeployvolume
          persistentVolumeClaim:
            claimName: mysite-pvc