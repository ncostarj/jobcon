services:
  jobcon-nginx:
    image: nginx:latest
    container_name: jobcon-nginx
    volumes:
      - ./src:/var/www/html/jobcon
      - "./config/conf.d:/etc/nginx/conf.d"
    depends_on:
      - jobcon-php
    restart: unless-stopped
    networks:
      - harbor-gateway
  jobcon-php:
    image: harbor/php:8.2-fpm
    container_name: jobcon-php
    working_dir: /var/www/html/jobcon
    volumes:
      - ./src:/var/www/html/jobcon
      - ~/.ssh:/home/harbor/.ssh:ro
    restart: unless-stopped
    networks:
      harbor-gateway:
        aliases: 
          - jobcon.localhost
      harbor-data:
networks:
  harbor-gateway:
    external: true
  harbor-data:
    external: true